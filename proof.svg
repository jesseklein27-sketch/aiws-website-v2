<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 900" font-kerning="normal">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#6366F1"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/>
</linearGradient>
</defs>
<rect width="820" height="900" rx="14" fill="#191919" stroke="#2e2e2e"/>

<!-- Header -->
<text x="40" y="46" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6b67" font-weight="500" letter-spacing="0.4">AI Wealth Systems  /  Marketing Department  /  Meta Ads Specialist</text>
<rect x="40" y="62" width="44" height="44" rx="10" fill="url(#g)"/>
<text x="62" y="93" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">AI</text>
<text x="98" y="95" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#EAE8E3">Campaign Brief — Meta Ads</text>
<text x="40" y="130" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6b67">Client: DTC skincare launch  ·  Budget: $1,400 test  ·  Prepared by <tspan fill="#8B5CF6" font-weight="600">Meta Ads Specialist</tspan></text>
<line x1="40" y1="148" x2="780" y2="148" stroke="#2a2a2a"/>

<!-- A) Campaign Architecture -->
<text x="40" y="180" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#D9A441" letter-spacing="0.3">A) Campaign Architecture</text>
<text x="40" y="205" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">Objective:  Sales  —  optimize for Purchase, not clicks</text>
<text x="40" y="227.5" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">Ad Set 1:  Retargeting  —  Website Visitors, 90 Days</text>
<text x="40" y="250.0" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">Ad Set 2:  Lookalikes  —  Purchasers, US/CA, 1-3%</text>
<text x="40" y="272.5" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">Ad Set 3:  Cold Traffic  —  Interests: Skincare, Beauty, Wellness</text>

<!-- B) Three Ad Angles -->
<text x="40" y="312" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#D9A441" letter-spacing="0.3">B) Three Ad Angles</text>
<text x="40" y="337" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">1) Problem/Solution:  "Breakouts ruining your mornings? Calm, clear</text>
<text x="40" y="359.5" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">   skin in 7 days — dermatologist-formulated."</text>
<text x="40" y="382.0" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#7a7873">   Visual:  Split-screen before/after — irritated skin vs. clear glow</text>
<text x="40" y="404.5" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">2) Social Proof:  "4.9 stars from 2,300+ customers — my skin in two</text>
<text x="40" y="427.0" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">   weeks, unreal."</text>
<text x="40" y="449.5" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#7a7873">   Visual:  UGC-style selfie review with results overlay</text>
<text x="40" y="472.0" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">3) Offer:  "Starter kit $29 — free shipping this week only."</text>
<text x="40" y="494.5" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#7a7873">   Visual:  Product flat-lay, price lockup, urgency ribbon</text>

<!-- C) Testing Budget -->
<text x="40" y="534" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#D9A441" letter-spacing="0.3">C) Testing Budget Allocation</text>
<text x="40" y="559" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">Total:  $1,400 over 14 days  —  $100/day across 3 angles</text>
<text x="40" y="581.5" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">Days 1-3:  $33/day per angle  —  kill anything above $50 CPA</text>
<text x="40" y="604.0" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">Days 4-14:  shift 70% of budget to the winning angle</text>
<text x="40" y="626.5" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">Scale rule:  +20% budget every 48h while CPA &lt; $50 and ROAS &gt; 2.5</text>

<!-- D) Success Metrics -->
<text x="40" y="666" font-family="Georgia,'Times New Roman',serif" font-size="15.5" fill="#D9A441" letter-spacing="0.3">D) Success Metrics &amp; Targets</text>
<text x="40" y="691" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">Targets:  CTR &gt; 1.5%   ·   CPA &lt; $50   ·   ROAS &gt; 2.5</text>
<text x="40" y="713.5" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">Review:  daily spend check  —  creative refresh every 7 days</text>
<text x="40" y="736.0" font-family="'Courier New',Courier,monospace" font-size="12.8" fill="#C9C7C2">Kill switch:  any ad set spending $150 with zero purchases</text>

<!-- Footer -->
<line x1="40" y1="800" x2="780" y2="800" stroke="#262626"/>
<text x="40" y="830" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#55534f">Structured output · PROMPTOS-scored 9.2/10</text>
<circle cx="262" cy="826.5" r="3.5" fill="#8B5CF6"/>
<text x="276" y="830" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#55534f">Excerpt — full brief continues in your workspace</text>
<text x="780" y="830" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#55534f" text-anchor="end">aisystemswealth.com</text>
</svg>
